<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MediManage Pro – Pharmacy management system</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef3f2;--surface:#fff;--ink:#10211f;--muted:#5d716e;--line:#d9e3e1;--brand:#0b6b5d;--brand-d:#084f45;--soft:#dcf0ec;--warn:#c2410c;--warn-soft:#ffe9dd;--ok:#15803d;--side:#0a2b27;--r:14px;--sh:0 1px 2px rgba(16,33,31,.06),0 8px 24px rgba(16,33,31,.06)}
:root[data-theme=dark]{--bg:#0d1716;--surface:#142220;--ink:#e6f1ef;--muted:#92a9a5;--line:#243936;--brand:#2fb9a3;--brand-d:#5fd3c0;--soft:#173833;--warn:#fb923c;--warn-soft:#3a2416;--ok:#4ade80;--side:#081412;--sh:none}
*{box-sizing:border-box}
body{margin:0;font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
aside.side{background:var(--side);color:#cfe5e1;padding:1.25rem 1rem;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:.25rem}
.logo{display:flex;align-items:center;gap:.6rem;font-weight:800;font-size:1.15rem;color:#fff;padding:.25rem .5rem 1.25rem}
.logo i{width:32px;height:32px;border-radius:9px;background:#2fb9a3;position:relative;display:block}
.logo i::before,.logo i::after{content:"";position:absolute;background:#fff;border-radius:2px;left:50%;top:50%;transform:translate(-50%,-50%)}
.logo i::before{width:16px;height:4px}.logo i::after{width:4px;height:16px}
.side a{display:block;padding:.65rem .85rem;border-radius:10px;color:inherit;text-decoration:none;font-weight:600;font-size:.94rem}
.side a:hover{background:rgba(255,255,255,.08)}
.side a.on{background:#2fb9a3;color:#06231f}
.side .foot{margin-top:auto;font-size:.8rem;opacity:.7;padding:.5rem}
main{padding:1.5rem clamp(1rem,3vw,2.25rem) 3rem;min-width:0}
.top{display:flex;align-items:center;justify-content:space-between;gap:1rem;margin-bottom:1.25rem;flex-wrap:wrap}
.top h1{margin:0;font-size:1.7rem;letter-spacing:-.03em}
.top p{margin:0;color:var(--muted)}
.btn{border:0;border-radius:10px;padding:.65rem 1.1rem;font-weight:700;cursor:pointer;background:var(--brand);color:#fff;transition:background .15s}
.btn:hover{background:var(--brand-d)}.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--warn-soft);color:var(--warn)}
.btn.sm{padding:.35rem .7rem;font-size:.83rem;border-radius:8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.card-h{display:flex;flex-wrap:wrap;gap:.75rem;align-items:center;justify-content:space-between;padding:1rem 1.25rem;border-bottom:1px solid var(--line)}
.card-h h2{margin:0;font-size:1.05rem}
.pad{padding:1.25rem}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem;margin-bottom:1.25rem}
.stat{padding:1.1rem 1.25rem}.stat b{display:block;font-size:1.8rem;letter-spacing:-.03em;line-height:1.15}.stat span{color:var(--muted);font-size:.86rem}
.stat.w b{color:var(--warn)}
.cols{display:grid;grid-template-columns:1.5fr 1fr;gap:1.25rem;margin-bottom:1.25rem}
.pos{display:grid;grid-template-columns:1fr 380px;gap:1.25rem;align-items:start}
input,select{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:.55rem .8rem;min-width:0}
input:focus,select:focus{border-color:var(--brand)}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:.78rem;color:var(--muted);font-weight:600;padding:.65rem 1.25rem}
td{padding:.7rem 1.25rem;border-top:1px solid var(--line);vertical-align:middle}
tr.click{cursor:pointer}tr.click:hover td{background:var(--soft)}
.tag{display:inline-block;font-size:.72rem;font-weight:700;padding:.1rem .55rem;border-radius:99px;background:var(--soft);color:var(--brand-d)}
.tag.w{background:var(--warn-soft);color:var(--warn)}
.acts{display:flex;gap:.4rem;justify-content:flex-end}
.empty{padding:2rem;text-align:center;color:var(--muted)}
.scroll{overflow-x:auto}
.step{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.step button{border:0;background:var(--bg);width:28px;height:28px;cursor:pointer;font-weight:700}
.step span{min-width:28px;text-align:center;font-weight:700;font-size:.9rem}
.cart{position:sticky;top:1rem}
.line{display:flex;justify-content:space-between;align-items:center;gap:.5rem;padding:.65rem 1.25rem;border-bottom:1px dashed var(--line)}
.sum div{display:flex;justify-content:space-between;color:var(--muted);padding:.2rem 0}
.sum .t{color:var(--ink);font-size:1.35rem;font-weight:800;border-top:2px solid var(--ink);margin-top:.4rem;padding-top:.5rem}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
.inv{max-width:720px;margin:0 auto;padding:2rem}
.inv h2{margin:0}.inv .meta{display:flex;justify-content:space-between;flex-wrap:wrap;gap:1rem;margin:1rem 0;color:var(--muted)}
.bars text{fill:var(--muted);font-size:11px;font-family:inherit}.bars rect{fill:var(--brand)}
.mini{display:flex;justify-content:space-between;padding:.6rem 1.25rem;border-top:1px solid var(--line);font-size:.92rem}
.feat{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:1rem}
.chips{display:flex;flex-wrap:wrap;gap:.5rem}
.chips span{background:var(--soft);color:var(--brand-d);padding:.3rem .8rem;border-radius:99px;font-weight:600;font-size:.88rem}
dialog{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);color:var(--ink);padding:1.5rem;width:min(440px,92vw)}
dialog::backdrop{background:rgba(5,15,13,.55)}
dialog form{display:grid;gap:.75rem}dialog label{display:grid;gap:.25rem;font-weight:600;font-size:.88rem}
#toasts{position:fixed;right:1rem;bottom:1rem;display:grid;gap:.5rem;z-index:50}
.toast{background:var(--ink);color:var(--bg);padding:.7rem 1rem;border-radius:10px;font-weight:600;font-size:.9rem}
[hidden]{display:none!important}
.stats.five{grid-template-columns:repeat(5,1fr)}
@media (max-width:1150px){.stats.five{grid-template-columns:repeat(3,1fr)}}
@media (max-width:900px){.stats.five{grid-template-columns:repeat(2,1fr)}}
.bars rect.p{fill:#e0a100}.sub{color:var(--muted);font-size:.78rem}
.side .tag{margin-left:.3rem}
@media (max-width:900px){.app{grid-template-columns:1fr}aside.side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center}.side .foot,.side .logo{display:none}.stats{grid-template-columns:repeat(2,1fr)}.cols,.pos{grid-template-columns:1fr}.cart{position:static}}
@media print{aside.side,.top,.noprint,#toasts{display:none!important}.app{display:block}.card{box-shadow:none;border:0}body{background:#fff;color:#000}}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="logo"><i></i>MediManage Pro</div>
    <a href="#/dashboard" data-r="dashboard">Dashboard</a>
    <a href="#/inventory" data-r="inventory">Inventory</a>
    <a href="#/billing" data-r="billing">New bill</a>
    <a href="#/invoices" data-r="invoices">Invoices</a>
    <a href="#/reports" data-r="reports">Reports</a>
    <a href="#/alerts" data-r="alerts">Alerts <span class="tag w" id="badge" hidden></span></a>
    <a href="#/about" data-r="about">About project</a>
    <button class="btn ghost sm" id="theme" style="margin-top:.75rem">Toggle theme</button>
    <div class="foot">Data is stored in your browser. <a href="#" id="reset" style="color:inherit">Reset demo data</a></div>
  </aside>
  <main id="view"></main>
</div>

<dialog id="dlg">
  <form id="mForm">
    <h2 id="mTitle" style="margin:0">Add medicine</h2>
    <input type="hidden" id="mId">
    <label>Name<input id="mName" required></label>
    <label>Category<select id="mCat"><option>Pain relief</option><option>Antibiotic</option><option>Diabetes</option><option>Heart</option><option>Digestive</option><option>Thyroid</option><option>Other</option></select></label>
    <div class="grid2" style="grid-template-columns:repeat(3,1fr)"><label>Price (₹)<input id="mPrice" type="number" min="1" step="0.5" required></label><label>Cost (₹)<input id="mCost" type="number" min="0" step="0.1" required></label><label>Stock<input id="mStock" type="number" min="0" required></label></div>
    <div class="grid2"><label>Expiry date<input id="mExp" type="date" required></label><label>Reorder level<input id="mReorder" type="number" min="0" value="8" required></label></div>
    <div class="grid2"><button type="button" class="btn ghost" id="mCancel">Cancel</button><button class="btn">Save medicine</button></div>
  </form>
</dialog>
<dialog id="qrDlg"><div style="text-align:center"><h2 id="qrTitle" style="margin-top:0"></h2><div id="qrBox" style="display:inline-block;padding:10px;background:#fff;border-radius:8px"></div><p id="qrTxt" style="color:var(--muted);font-size:.85rem"></p><div class="grid2"><a class="btn ghost" id="qrDl" download="medimanage-qr.png" style="text-decoration:none">Download PNG</a><button class="btn" onclick="$('qrDlg').close()">Close</button></div></div></dialog>
<dialog id="rsDlg"><form id="rsForm"><h2 style="margin:0">Restock <span id="rsName"></span></h2><input type="hidden" id="rsId"><label>Units received<input id="rsQty" type="number" min="1" required></label><label>Expiry of new batch<input id="rsExp" type="date" required></label><div class="grid2"><button type="button" class="btn ghost" onclick="$('rsDlg').close()">Cancel</button><button class="btn">Add stock</button></div></form></dialog>
<dialog id="scanDlg"><h2 style="margin-top:0">Scan medicine QR</h2><video id="vid" playsinline muted style="width:100%;border-radius:10px;background:#000"></video><button class="btn ghost" style="margin-top:.75rem;width:100%" onclick="$('scanDlg').close()">Cancel</button></dialog>
<div id="toasts" role="status" aria-live="polite"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
/* ---------- helpers ---------- */
const KEY='medimanage.pro.v1', LOW=8, GST=0.05;
const $=id=>document.getElementById(id);
const rs=n=>'₹'+(Math.round(n*100)/100).toLocaleString('en-IN');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dstr=d=>new Date(d).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'});
const addDays=n=>{const d=new Date();d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};
const daysTo=d=>Math.ceil((new Date(d)-new Date())/864e5);
const toast=t=>{const d=document.createElement('div');d.className='toast';d.textContent=t;$('toasts').append(d);setTimeout(()=>d.remove(),2800)};
const lv=m=>m.reorder??LOW;
const unitCost=m=>m.cost??+(m.price*0.7).toFixed(1), itemCost=x=>x.cost??x.price*0.7;
const dayKey=d=>new Date(d).toDateString(), pct=n=>n.toFixed(1)+'%';
const invProfit=i=>i.sub-i.items.reduce((t,x)=>t+itemCost(x)*x.qty,0);
function fin(list){const inc=list.reduce((t,i)=>t+i.sub,0),c=list.reduce((t,i)=>t+i.items.reduce((u,x)=>u+itemCost(x)*x.qty,0),0);return{n:list.length,units:list.reduce((t,i)=>t+i.items.reduce((u,x)=>u+x.qty,0),0),inc,cost:c,profit:inc-c,margin:inc?(inc-c)/inc*100:0}}
const byDay=n=>[...Array(n)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()-(n-1-i));return{d,...fin(S.invoices.filter(x=>dayKey(x.date)===dayKey(d)))}});
let rangeDays=7,invQ='',invP='';
const todayStrip=()=>{const t=fin(S.invoices.filter(i=>dayKey(i.date)===dayKey(new Date())));return`<div class="stats five">
  <div class="card stat"><b>${rs(t.inc)}</b><span>Income today</span></div>
  <div class="card stat"><b style="color:var(--ok)">${rs(t.profit)}</b><span>Profit today</span></div>
  <div class="card stat"><b>${pct(t.margin)}</b><span>Margin today</span></div>
  <div class="card stat"><b>${t.n}</b><span>Bills today</span></div>
  <div class="card stat"><b>${t.units}</b><span>Items sold today</span></div></div>`};
const sets=()=>({ex:S.meds.filter(m=>daysTo(m.exp)<0&&m.stock>0),soon:S.meds.filter(m=>{const d=daysTo(m.exp);return d>=0&&d<=60&&m.stock>0}),low:S.meds.filter(m=>m.stock<=lv(m)&&!(daysTo(m.exp)<0&&m.stock>0))});
const updateBadge=()=>{const t=sets(),n=t.ex.length+t.soon.length+t.low.length;$('badge').textContent=n;$('badge').hidden=!n};
function makeQR(el,text,size=160){if(!el)return;el.innerHTML='';if(typeof QRCode==='undefined'){el.textContent=text;return}new QRCode(el,{text,width:size,height:size,correctLevel:QRCode.CorrectLevel.M})}
function showQR(title,text,note){$('qrTitle').textContent=title;$('qrTxt').textContent=note;makeQR($('qrBox'),text,180);$('qrDlg').showModal();setTimeout(()=>{const c=$('qrBox').querySelector('canvas');if(c)$('qrDl').href=c.toDataURL()},80)}
let stream,scanTimer;
async function startScan(){
  if(!('BarcodeDetector' in window)){toast('Camera scan is not supported in this browser. Type the code instead.');return}
  try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}})}catch(e){toast('Camera permission was denied');return}
  const v=$('vid');v.srcObject=stream;await v.play();$('scanDlg').showModal();
  const det=new BarcodeDetector({formats:['qr_code']});
  scanTimer=setInterval(async()=>{const r=await det.detect(v).catch(()=>[]);if(r.length){$('scanDlg').close();addByCode(r[0].rawValue)}},600);
}
function addByCode(raw){
  const c=raw.trim().toLowerCase(),m=S.meds.find(x=>c==='medi:'+x.id||x.name.toLowerCase()===c);
  if(!m){toast('No medicine matches that code');return false}
  if(daysTo(m.exp)<0){toast(m.name+' is expired and cannot be sold');return false}
  if((cart[m.id]||0)>=m.stock){toast('No more '+m.name+' in stock');return false}
  cart[m.id]=(cart[m.id]||0)+1;toast(m.name+' added to bill');if($('cartBox'))rerenderCart();return true;
}

/* ---------- data layer ---------- */
function seed(){
  const meds=[["Paracetamol","Pain relief",15,20,400],["Aspirin","Pain relief",12,15,300],["Ibuprofen","Pain relief",20,10,25],["Amoxicillin","Antibiotic",30,5,-12],["Ciprofloxacin","Antibiotic",25,0,500],["Metformin","Diabetes",18,12,350],["Atorvastatin","Heart",22,8,40],["Omeprazole","Digestive",17,14,280],["Losartan","Heart",19,11,420],["Levothyroxine","Thyroid",24,0,150]]
   .map((m,i)=>({id:i+1,name:m[0],cat:m[1],price:m[2],stock:m[3],exp:addDays(m[4]),cost:+(m[2]*(0.6+(i%5)*0.04)).toFixed(1)}));
  const invoices=[];let no=100;
  for(let d=13;d>=0;d--)for(let k=0;k<2+(d%3);k++){
    const a=meds[(d*3+k*2)%10],b=meds[(d+k*5+1)%10],items=[{name:a.name,price:a.price,cost:a.cost,qty:1+k},{name:b.name,price:b.price,cost:b.cost,qty:2}];
    const sub=items.reduce((s,i)=>s+i.price*i.qty,0),dt=new Date();dt.setDate(dt.getDate()-d);
    invoices.push({no:++no,date:dt.toISOString(),customer:['Walk-in','Rohan Patil','Sneha Joshi','Amit Kale'][(d+k)%4],pay:['Cash','UPI','Card'][(d+k)%3],items,sub,gst:sub*GST,total:sub*(1+GST)});
  }
  return {meds,invoices:invoices.reverse(),nextId:11,invNo:no+1};
}
let S;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!Array.isArray(S.meds)||!Array.isArray(S.invoices))S=seed();
S.meds.forEach(m=>{m.price=+m.price||0;m.stock=+m.stock||0;m.exp=m.exp||addDays(365);m.cat=m.cat||'Other'});
S.invoices.forEach(i=>{i.items=i.items||[];i.sub=+i.sub||0;i.total=+i.total||0;i.customer=i.customer||'Walk-in';i.pay=i.pay||'Cash'});
S.nextId=S.nextId||S.meds.reduce((a,m)=>Math.max(a,m.id),0)+1;S.invNo=S.invNo||S.invoices.reduce((a,i)=>Math.max(a,i.no),100)+1;
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
let cart={},customer='',pay='Cash';
const cartRows=()=>Object.keys(cart).map(id=>({m:S.meds.find(x=>x.id==id),q:cart[id]})).filter(r=>r.m);
const cartSub=()=>cartRows().reduce((s,r)=>s+r.m.price*r.q,0);

/* ---------- pages ---------- */
const head=(t,sub,btn='')=>`<div class="top"><div><h1>${t}</h1><p>${sub}</p></div>${btn}</div>`;

function dashboard(){
  const units=S.meds.reduce((t,m)=>t+m.stock,0),t=sets(),out=S.meds.filter(m=>m.stock===0),
    td=fin(S.invoices.filter(i=>dayKey(i.date)===dayKey(new Date()))),days=byDay(7),max=Math.max(...days.map(x=>x.inc),1);
  const bars=days.map((x,i)=>{const h=x.inc/max*120,p=Math.max(x.profit,0)/max*120,X=i*76+10;return`<rect x="${X}" y="${140-h}" width="26" height="${h}" rx="4"><title>Income ${rs(x.inc)}</title></rect><rect class="p" x="${X+28}" y="${140-p}" width="26" height="${p}" rx="4"><title>Profit ${rs(x.profit)}</title></rect><text x="${X+27}" y="160" text-anchor="middle">${x.d.toLocaleDateString('en-IN',{weekday:'short'})}</text>`}).join('');
  const tg=(m,x)=>`<div class="mini"><span>${esc(m.name)}</span><span class="tag w">${x}</span></div>`;
  return head('Dashboard','Income, profit and stock at a glance.','<a class="btn" href="#/billing">Create bill</a>')+
  `<div class="stats">
    <div class="card stat"><b>${rs(td.inc)}</b><span>Income today (excl. GST)</span></div>
    <div class="card stat"><b style="color:var(--ok)">${rs(td.profit)}</b><span>Profit today</span></div>
    <div class="card stat"><b>${pct(td.margin)}</b><span>Profit margin today</span></div>
    <div class="card stat"><b>${td.n}</b><span>Bills today</span></div></div>
  <div class="stats">
    <div class="card stat"><b>${S.meds.length}</b><span>Medicines listed</span></div>
    <div class="card stat"><b>${units}</b><span>Units in stock</span></div>
    <div class="card stat w"><b>${t.low.length}</b><span>Low or out of stock</span></div>
    <div class="card stat w"><b>${out.length}</b><span>Out of stock</span></div></div>
  <div class="cols">
    <div class="card"><div class="card-h"><h2>Income and profit, last 7 days</h2><span style="font-size:.82rem;color:var(--muted)"><b style="color:var(--brand)">■</b> Income <b style="color:#e0a100">■</b> Profit</span></div><div class="pad"><svg class="bars" viewBox="0 0 540 170" width="100%" role="img" aria-label="Income and profit per day">${bars}</svg></div></div>
    <div class="card"><div class="card-h"><h2>Needs attention</h2><a class="btn ghost sm" href="#/alerts">Open alerts</a></div>
      ${t.ex.map(m=>tg(m,'Expired')).join('')}${t.soon.map(m=>tg(m,'Expires in '+daysTo(m.exp)+'d')).join('')}${t.low.filter(m=>m.stock>0).map(m=>tg(m,m.stock+' left')).join('')}
      ${t.ex.length+t.soon.length+t.low.length-out.length>0?'':'<div class="empty">All stock levels and expiry dates look fine.</div>'}</div></div>
  <div class="cols">
    <div class="card"><div class="card-h"><h2>Out of stock</h2><span style="font-size:.85rem;color:var(--muted)">${out.length} items</span></div>
      ${out.map(m=>`<div class="mini"><span><b>${esc(m.name)}</b> <span class="sub">${esc(m.cat)}</span></span><button class="btn sm" data-a="restock" data-id="${m.id}">Restock</button></div>`).join('')||'<div class="empty">Every medicine is in stock.</div>'}</div>
    <div class="card"><div class="card-h"><h2>Recent invoices</h2><a class="btn ghost sm" href="#/invoices">View all</a></div>
      <div class="scroll"><table><thead><tr><th>Invoice</th><th>Customer</th><th>Total</th></tr></thead><tbody>
      ${S.invoices.slice(0,5).map(i=>`<tr class="click" data-a="open" data-id="${i.no}"><td>#MEDI${i.no}</td><td>${esc(i.customer)}</td><td>${rs(i.total)}</td></tr>`).join('')}</tbody></table></div></div></div>`;
}
function reports(){
  const days=byDay(rangeDays).reverse(),keys=new Set(days.map(x=>dayKey(x.d))),inR=S.invoices.filter(i=>keys.has(dayKey(i.date))),tot=fin(inR),top={},cats={},pays={};
  inR.forEach(i=>{pays[i.pay]=(pays[i.pay]||0)+i.sub;i.items.forEach(x=>{const pr=(x.price-itemCost(x))*x.qty,inc=x.price*x.qty,c=(S.meds.find(m=>m.name===x.name)||{}).cat||'Other';
    const o=top[x.name]||(top[x.name]={qty:0,inc:0,profit:0});o.qty+=x.qty;o.inc+=inc;o.profit+=pr;
    const k=cats[c]||(cats[c]={qty:0,inc:0,profit:0});k.qty+=x.qty;k.inc+=inc;k.profit+=pr})});

document.addEventListener('input',e=>{
  if(['q','cf','sf'].includes(e.target.id))$('rows').innerHTML=invRows($('q').value,$('cf').value,$('sf').value);
  if(e.target.id==='pq')$('pick').innerHTML=pickRows(e.target.value);
  if(e.target.id==='cust')customer=e.target.value;
  if(e.target.id==='pay')pay=e.target.value;
  if(e.target.id==='rng'){rangeDays=+e.target.value;route()}
  if(e.target.id==='iq'||e.target.id==='ip'){invQ=$('iq').value;invP=$('ip').value;$('irows').innerHTML=invRowsHtml()}
});
$('mForm').addEventListener('submit',e=>{
  e.preventDefault();
  const o={name:$('mName').value.trim(),cat:$('mCat').value,price:parseFloat($('mPrice').value),cost:parseFloat($('mCost').value),stock:parseInt($('mStock').value,10),exp:$('mExp').value,reorder:parseInt($('mReorder').value,10)||0},id=+$('mId').value;
  if(S.meds.some(m=>m.id!==id&&m.name.toLowerCase()===o.name.toLowerCase())){toast(o.name+' already exists');return}
  if(id)Object.assign(S.meds.find(m=>m.id===id),o);else S.meds.push({id:S.nextId++,...o});
  save();$('dlg').close();route();toast(o.name+' saved');
});
$('mCancel').onclick=()=>$('dlg').close();
$('theme').onclick=()=>{const r=document.documentElement;r.dataset.theme=r.dataset.theme==='dark'?'light':'dark'};
$('reset').onclick=e=>{e.preventDefault();if(confirm('Reset all data to the demo set?')){S=seed();cart={};save();route();toast('Demo data restored')}};
$('rsForm').addEventListener('submit',e=>{
  e.preventDefault();const m=S.meds.find(x=>x.id==$('rsId').value),ne=$('rsExp').value,keep=m.stock>0&&daysTo(m.exp)>=0;
  m.exp=keep&&m.exp<ne?m.exp:ne;m.stock+=parseInt($('rsQty').value,10);save();$('rsDlg').close();route();toast(m.name+' restocked');
});
$('scanDlg').addEventListener('close',()=>{clearInterval(scanTimer);if(stream)stream.getTracks().forEach(t=>t.stop());stream=null});
document.addEventListener('keydown',e=>{if(e.target.id==='code'&&e.key==='Enter'){e.preventDefault();if(addByCode(e.target.value))e.target.value=''}});
route();
{const t=sets();if(t.ex.length)toast(t.ex.length+' expired medicine'+(t.ex.length>1?'s':'')+' on the shelf. Open Alerts.')}
</script>
</body>
</html>
